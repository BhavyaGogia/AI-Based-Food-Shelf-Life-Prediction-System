<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elliptical Galaxy</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';
    import { CopyShader } from 'three/addons/shaders/CopyShader.js';

    // Helper functions
    const Lerp = (a, b, t = 0.075) => a + (b - a) * t;
    
    function hexToVec3(hex) {
      const n = parseInt(hex.slice(1), 16);
      return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
    }
    
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    // Theme Palettes
    const PALETTES = {
      dark: {
        bgColor: '#02030a',
        cornerBlue: '#ffcf2a',     // gold corner flame
        cornerOrange: '#ff3b1f',   // red corner flame
        coreColor: '#fff3b0',      // bright gold nucleus
        midColor: '#ffb52a',       // warm amber body
        rimColor: '#3a1402',       // near-black deep-brown rim
        twinkleColor: '#ff5e8a',   // pink-rose twinkle
        atmoColor: '#ffd9a0',      // gold ambient motes
        opacity: 1.0,
        brightness: 1.0
      },
      light: {
        bgColor: '#f4f6fa',
        cornerBlue: '#a5b4fc',     // soft lavender corner flame
        cornerOrange: '#c084fc',   // light purple corner flame
        coreColor: '#ffffff',      // glowing white nucleus
        midColor: '#4f46e5',       // vibrant indigo galaxy core
        rimColor: '#e0e7ff',       // soft fade out rim
        twinkleColor: '#f43f5e',   // rose twinkle accent
        atmoColor: '#6366f1',      // indigo/lavender motes
        opacity: 0.85,
        brightness: 1.2
      }
    };

    // Determine initial mode
    const urlParams = new URLSearchParams(window.location.search);
    let currentMode = urlParams.get('mode') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (!PALETTES[currentMode]) currentMode = 'dark';

    // State for smooth transition
    const activePalette = {
      bgColor: hexToVec3(PALETTES[currentMode].bgColor),
      cornerBlue: hexToVec3(PALETTES[currentMode].cornerBlue),
      cornerOrange: hexToVec3(PALETTES[currentMode].cornerOrange),
      coreColor: hexToVec3(PALETTES[currentMode].coreColor),
      midColor: hexToVec3(PALETTES[currentMode].midColor),
      rimColor: hexToVec3(PALETTES[currentMode].rimColor),
      twinkleColor: hexToVec3(PALETTES[currentMode].twinkleColor),
      atmoColor: hexToVec3(PALETTES[currentMode].atmoColor),
      opacity: PALETTES[currentMode].opacity,
      brightness: PALETTES[currentMode].brightness
    };

    // Constants
    const galaxyCount   = 79;
    const spread        = 13;
    const radius        = 3; // base scale
    const pointCount    = 25000;
    const tumbleSpeed   = 0.2;
    const wobbleAmount  = 0.205;
    const wobbleSpeed   = 0.35;
    const gradientPow   = 0.2;
    const twinkleAmount = 0.71;
    const twinkleSpeed  = 2.45;
    const scrollDiveZ   = 4;
    const scrollSpin    = 2.62;
    const scrollExpand  = 1;
    const atmoCount     = 350;
    const atmoSize      = 14;
    const atmoSpeed     = 0.8;

    const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 };

    // Boilerplate Setup
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.VSMShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 0, 15);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(0, 0, 14);
    camera.layers.enable(LAYERS.TORUS_SCENE);
    camera.layers.enable(LAYERS.BLOOM_SCENE);
    camera.layers.enable(LAYERS.ENTIRE_SCENE);
    scene.add(camera);

    // Galaxy Field Class
    class GalaxyField {
      constructor() {
        this.R = 1.7;
        this.count = { stars: 90000 };
        this.group = new THREE.Group();
        this.group.position.set(0, 0, 0);
        this.group.visible = false;
        
        const geom = this.geometry();
        const mat = this.material();
        
        this.cloud = new THREE.Points(geom, mat);
        this.cloud.position.set(0, 0, -0.8);
        this.cloud.layers.set(LAYERS.ENTIRE_SCENE);
        
        this.group.add(this.cloud);
        scene.add(this.group);
      }

      geometry() {
        const N = this.count.stars;
        const positions = new Float32Array(N * 3);
        const shells = new Float32Array(N);
        const sizes = new Float32Array(N);
        const ids = new Float32Array(N);
        const K = Math.max(1, Math.round(79));
        const SP = 13;
        const frames = [];
        
        for (let k = 0; k < K; k++) {
          frames.push({
            m: new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(
              Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI)),
            size: 0.18 + 0.34 * Math.random(),
            ecc: 0.45 + 0.42 * Math.random(),
            thick: 0.06 + 0.05 * Math.random(),
            ox: (Math.random() - 0.5) * 2 * SP,
            oy: (Math.random() - 0.5) * 2 * SP,
            oz: (Math.random() - 0.5) * 2 * SP * 0.6
          });
        }
        
        const tmp = new THREE.Vector3();
        for (let i = 0; i < N; i++) {
          const f = frames[i % K];
          const th = Math.random() * 2 * Math.PI;
          const rad = Math.pow(Math.random(), 1.4);
          const rx = f.size * this.R * rad;
          const rz = f.size * this.R * f.ecc * rad;
          const y = (Math.random() - 0.5) * 2 * f.thick * this.R * rad;
          
          tmp.set(rx * Math.cos(th), y, rz * Math.sin(th)).applyMatrix4(f.m);
          tmp.x += f.ox; tmp.y += f.oy; tmp.z += f.oz;
          
          positions[i * 3]     = tmp.x;
          positions[i * 3 + 1] = tmp.y;
          positions[i * 3 + 2] = tmp.z;
          shells[i] = rad;
          sizes[i]  = 6 + 9 * Math.random();
          ids[i]    = Math.random();
        }
        
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        g.setAttribute('shell',    new THREE.BufferAttribute(shells, 1));
        g.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));
        g.setAttribute('id',       new THREE.BufferAttribute(ids, 1));
        return g;
      }

      material() {
        return new THREE.ShaderMaterial({
          blending: THREE.AdditiveBlending,
          depthTest: false,
          transparent: true,
          uniforms: {
            iTime: { value: 0 },
            iAnimate: { value: 0 },
            uOpacity: { value: 0 },
            uExpand: { value: 1 },
            uWobbleAmount: { value: wobbleAmount },
            uWobbleSpeed: { value: wobbleSpeed },
            uCore: { value: activePalette.coreColor },
            uMid: { value: activePalette.midColor },
            uRim: { value: activePalette.rimColor },
            uTwinkle: { value: activePalette.twinkleColor },
            uGradientPow: { value: gradientPow },
            uTwinkleAmount: { value: twinkleAmount },
            uTwinkleSpeed: { value: twinkleSpeed }
          },
          vertexShader: `
            attribute float size; attribute float id; attribute float shell;
            uniform float iTime; uniform float iAnimate; uniform float uExpand;
            uniform float uWobbleAmount; uniform float uWobbleSpeed;
            varying float vShell; varying float vId;
            void main() {
              vShell = shell; vId = id;
              float ph = id * 6.2831853;
              vec3 wob = vec3(sin(iTime * uWobbleSpeed + ph),
                              cos(iTime * uWobbleSpeed * 1.3 + ph),
                              sin(iTime * uWobbleSpeed * 0.7 + ph)) * uWobbleAmount;
              vec3 p = (position + wob) * uExpand;
              vec4 mv = modelViewMatrix * vec4(p, 1.0);
              gl_PointSize = size / -mv.z * (0.5 + 0.5 * iAnimate);
              vec4 res = projectionMatrix * mv;
              float a = pow(iAnimate, 0.6);
              res.xy *= clamp(2.0 * a + pow(id, 0.7) - 1.0, 0.0, 1.0);
              gl_Position = res;
            }
          `,
          fragmentShader: `
            uniform float iTime; uniform float uOpacity;
            uniform vec3 uCore; uniform vec3 uMid; uniform vec3 uRim; uniform vec3 uTwinkle;
            uniform float uGradientPow; uniform float uTwinkleAmount; uniform float uTwinkleSpeed;
            varying float vShell; varying float vId;
            vec3 grad3(vec3 a, vec3 b, vec3 c, float t) {
              return t < 0.5 ? mix(a, b, t * 2.0) : mix(b, c, clamp((t - 0.5) * 2.0, 0.0, 1.0));
            }
            void main() {
              float t = pow(vShell, uGradientPow);
              vec3 col = grad3(uCore, uMid, uRim, t);
              float tw = 0.5 + 0.5 * sin(iTime * uTwinkleSpeed + vId * 100.0);
              col = mix(col, uTwinkle, tw * uTwinkleAmount * (1.0 - t));
              col *= (0.45 + 0.85 * (1.0 - t));
              float tex = 1.0 - smoothstep(0.5, 1.0, length(2.0 * gl_PointCoord - 1.0));
              gl_FragColor = vec4(col * tex, tex * uOpacity);
            }
          `
        });
      }

      render(scrollT, t, dt) {
        this.cloud.material.uniforms.iTime.value = t;
        this.cloud.material.uniforms.uExpand.value = 1 + scrollT * scrollExpand;
        
        const spin = tumbleSpeed * (1 + scrollT * scrollSpin) * dt;
        this.cloud.rotation.y += spin;
        this.cloud.rotation.x += spin * 0.35;
      }
    }

    const galaxy = new GalaxyField();

    // Atmosphere motes
    const atmoGeo = new THREE.BufferGeometry();
    const atmoPositions = new Float32Array(atmoCount * 3);
    const atmoSizes = new Float32Array(atmoCount);
    const atmoSeeds = new Float32Array(atmoCount);
    
    for (let i = 0; i < atmoCount; i++) {
      atmoPositions[i * 3] = Math.random() * 2 - 1;
      atmoPositions[i * 3 + 1] = Math.random() * 2 - 1;
      atmoPositions[i * 3 + 2] = Math.random() * 2 - 1;
      atmoSizes[i] = atmoSize * (0.4 + Math.random());
      atmoSeeds[i] = Math.random();
    }
    
    atmoGeo.setAttribute('position', new THREE.BufferAttribute(atmoPositions, 3));
    atmoGeo.setAttribute('size', new THREE.BufferAttribute(atmoSizes, 1));
    atmoGeo.setAttribute('seed', new THREE.BufferAttribute(atmoSeeds, 1));

    const atmoMat = new THREE.ShaderMaterial({
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false,
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: activePalette.atmoColor },
        uRes: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) }
      },
      vertexShader: `
        attribute float size; attribute float seed; uniform float uTime; uniform vec2 uRes;
        varying float vA;
        vec3 warp(vec3 p, float t){ float c=0.9,a=1.9,b=0.02,s=0.05; p*=2.;
          p.x+=c*sin(s*t+a*p.y)+t*b; p.y+=c*cos(s*t+a*p.x); p.y+=c*sin(s*t+a*p.z)+t*b;
          p.z+=c*cos(s*t+a*p.y); p.z+=c*sin(s*t+a*p.x)+t*b; p.x+=c*cos(s*t+a*p.z);
          return cos(p+vec3(1,2,4)); }
        void main(){
          vec3 v = position*4.0 + warp(position, uTime)*1.2;
          vec4 mv = modelViewMatrix * vec4(v, 1.0);
          float r = length(v); float farF = 1.0 - smoothstep(5.0, 6.5, r); float nearF = smoothstep(0.0, 0.5, -mv.z);
          vA = farF * nearF;
          gl_PointSize = size * uRes.y / 900.0 / -mv.z; gl_PointSize = max(gl_PointSize, 1.0);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor; varying float vA;
        void main(){ vec2 p = gl_PointCoord - 0.5; float l = length(p); if (l > 0.5) discard;
          float tex = smoothstep(0.5, 0.0, l); gl_FragColor = vec4(uColor * tex, tex * vA * 0.55); }
      `
    });

    const atmoPoints = new THREE.Points(atmoGeo, atmoMat);
    atmoPoints.frustumCulled = false;
    atmoPoints.layers.set(LAYERS.ENTIRE_SCENE);
    scene.add(atmoPoints);

    // Postprocessing setup
    const renderScene = new RenderPass(scene, camera);

    // torusComposer
    const torusComposer = new EffectComposer(renderer);
    torusComposer.renderToScreen = false;
    torusComposer.addPass(renderScene);
    torusComposer.addPass(new ShaderPass(GammaCorrectionShader));
    torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.22, 0.2, 0));
    torusComposer.addPass(new ShaderPass(CopyShader));

    // bloomComposer
    const bloomComposer = new EffectComposer(renderer);
    bloomComposer.renderToScreen = false;
    bloomComposer.addPass(renderScene);
    bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.35, 0.5, 0));
    bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));

    // Final Compositing Pass
    const FinalPass = {
      uniforms: {
        iTime: { value: 0 },
        tDiffuse: { value: null },
        torusTexture: { value: null },
        bloomTexture: { value: null },
        haloTexture: { value: null },
        iCornerBlue:   { value: activePalette.cornerBlue },
        iCornerOrange: { value: activePalette.cornerOrange },
        uBg: { value: activePalette.bgColor }
      },
      vertexShader: `
        varying vec2 vUv;
        void main(){
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float iTime;
        uniform sampler2D tDiffuse;
        uniform sampler2D bloomTexture;
        uniform sampler2D torusTexture;
        uniform sampler2D haloTexture;
        uniform vec3 iCornerBlue;
        uniform vec3 iCornerOrange;
        uniform vec3 uBg;
        varying vec2 vUv;
        
        vec3 warp3d(vec3 pos, float t) {
          float curv = 0.8, a = 1.9, b = 0.7;
          pos *= 2.0;
          pos.x += curv * sin(t + a * pos.y) + t * b;
          pos.y += curv * cos(t + a * pos.x);
          pos.y += curv * sin(t + a * pos.z) + t * b;
          pos.z += curv * cos(t + a * pos.y);
          pos.z += curv * sin(t + a * pos.x) + t * b;
          pos.x += curv * cos(t + a * pos.z);
          return 0.5 + 0.5 * cos(pos.xyz + vec3(1.0, 2.0, 4.0));
        }

        void main() {
          vec2 uv = 2.0 * vUv - 1.0;
          vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime * 1.5), vec3(1.5));
          vec3 col = 1.5 * iCornerBlue * w.x;
          col *= w.y;
          col += iCornerOrange * w.z;
          col *= smoothstep(0.6, 1.0, abs(uv.y));
          col *= smoothstep(-0.5, 1.0, -uv.y * uv.x);
          col *= smoothstep(-0.5, 1.0, -uv.y * uv.x);
          vec3 halo = texture2D(haloTexture, vUv).xyz;
          
          // Background color adapts dynamically
          vec3 atmoBg = uBg * (1.0 - 0.4 * length(uv));
          
          gl_FragColor = vec4(atmoBg + col * 0.2 + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.0);
        }
      `
    };

    const finalPass = new ShaderPass(FinalPass);
    const finalComposer = new EffectComposer(renderer);
    finalComposer.addPass(renderScene);
    finalComposer.addPass(finalPass);

    finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture;
    finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture;

    const dummyTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1, THREE.RGBAFormat);
    dummyTex.needsUpdate = true;
    finalPass.uniforms.haloTexture.value = dummyTex;

    // Interaction / Scroll State
    let scrollTarget = 0;
    let scrollCurrent = 0;
    let lastT = performance.now() / 1000;
    const appearStart = performance.now();

    // Listen to parent postMessage events
    window.addEventListener('message', (event) => {
      if (event.data && typeof event.data === 'object') {
        if (event.data.type === 'setMode' && PALETTES[event.data.mode]) {
          currentMode = event.data.mode;
        }
        if (event.data.type === 'setScroll') {
          scrollTarget = clamp(event.data.scroll, 0, 1);
        }
      }
    });

    // Fallback local scroll listener
    window.addEventListener('scroll', () => {
      const scrollHeight = document.documentElement.scrollHeight;
      const innerHeight = window.innerHeight;
      scrollTarget = clamp(window.scrollY / (scrollHeight - innerHeight), 0, 1);
    }, { passive: true });

    // Motes onBeforeRender hook logic
    atmoPoints.onBeforeRender = () => {
      const t = performance.now() / 1000;
      atmoMat.uniforms.uTime.value = t * atmoSpeed * 8.0;
      atmoPoints.position.copy(camera.position);
      finalPass.uniforms.iTime.value = t;
    };

    // Render loop
    function render() {
      requestAnimationFrame(render);
      
      const t = performance.now() / 1000;
      const dt = Math.min(0.05, t - lastT);
      lastT = t;

      // Smooth scroll interpolation
      scrollCurrent = Lerp(scrollCurrent, scrollTarget, 0.08);

      // Camera dive
      camera.position.z = 14 - scrollCurrent * scrollDiveZ;
      camera.lookAt(0, 0, 0);

      // Interpolate theme colors smoothly (buttery-smooth fade transition)
      const targetPalette = PALETTES[currentMode];
      const lerpSpeed = 0.05;

      activePalette.bgColor.lerp(hexToVec3(targetPalette.bgColor), lerpSpeed);
      activePalette.cornerBlue.lerp(hexToVec3(targetPalette.cornerBlue), lerpSpeed);
      activePalette.cornerOrange.lerp(hexToVec3(targetPalette.cornerOrange), lerpSpeed);
      activePalette.coreColor.lerp(hexToVec3(targetPalette.coreColor), lerpSpeed);
      activePalette.midColor.lerp(hexToVec3(targetPalette.midColor), lerpSpeed);
      activePalette.rimColor.lerp(hexToVec3(targetPalette.rimColor), lerpSpeed);
      activePalette.twinkleColor.lerp(hexToVec3(targetPalette.twinkleColor), lerpSpeed);
      activePalette.atmoColor.lerp(hexToVec3(targetPalette.atmoColor), lerpSpeed);
      activePalette.opacity += (targetPalette.opacity - activePalette.opacity) * lerpSpeed;
      activePalette.brightness += (targetPalette.brightness - activePalette.brightness) * lerpSpeed;

      // Update shader uniforms from interpolated activePalette
      galaxy.cloud.material.uniforms.uCore.value.copy(activePalette.coreColor);
      galaxy.cloud.material.uniforms.uMid.value.copy(activePalette.midColor);
      galaxy.cloud.material.uniforms.uRim.value.copy(activePalette.rimColor);
      galaxy.cloud.material.uniforms.uTwinkle.value.copy(activePalette.twinkleColor);

      atmoMat.uniforms.uColor.value.copy(activePalette.atmoColor);

      finalPass.uniforms.iCornerBlue.value.copy(activePalette.cornerBlue);
      finalPass.uniforms.iCornerOrange.value.copy(activePalette.cornerOrange);
      finalPass.uniforms.uBg.value.copy(activePalette.bgColor);

      // Appear-in animation (2000 ms total)
      const elapsed = performance.now() - appearStart;
      const tAnim = clamp(elapsed / 2000, 0, 1);
      const iAnimateVal = tAnim * tAnim * (3 - 2 * tAnim);
      
      // Update galaxy cloud material parameters
      galaxy.cloud.material.uniforms.iAnimate.value = iAnimateVal;

      if (elapsed > 500) {
        const slideElapsed = elapsed - 500;
        const tSlide = clamp(slideElapsed / 1500, 0, 1);
        const slideVal = 1 - Math.pow(1 - tSlide, 4);
        galaxy.group.position.z = Lerp(-20, 0, slideVal);
        
        // Target opacity adjusted by the active theme's maximum opacity setting
        galaxy.cloud.material.uniforms.uOpacity.value = tSlide * activePalette.opacity;
        galaxy.group.visible = true;
      }

      if (elapsed >= 2000) {
        galaxy.cloud.material.uniforms.iAnimate.value = 1.0;
      }

      // Render galaxy motion
      galaxy.render(scrollCurrent, t, dt);

      // Render composers
      camera.layers.set(LAYERS.TORUS_SCENE);
      torusComposer.render();
      
      camera.layers.set(LAYERS.BLOOM_SCENE);
      bloomComposer.render();
      
      camera.layers.set(LAYERS.ENTIRE_SCENE);
      finalComposer.render();
    }

    // Resize Handling
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      
      renderer.setSize(w, h, false);
      renderer.setPixelRatio(window.devicePixelRatio);
      
      torusComposer.setSize(w, h);
      bloomComposer.setSize(w, h);
      finalComposer.setSize(w, h);
      
      atmoMat.uniforms.uRes.value.set(w * window.devicePixelRatio, h * window.devicePixelRatio);
    });

    // Start render
    render();
  </script>
</body>
</html>
